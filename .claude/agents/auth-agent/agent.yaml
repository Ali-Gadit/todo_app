  ### 4. Auth Schemas
  ```python
  # backend/src/schemas/auth.py
  from pydantic import BaseModel, EmailStr

  class UserCreate(BaseModel):
      email: EmailStr
      username: str
      password: str  # min 8 chars

  class UserLogin(BaseModel):
      email: EmailStr
      password: str

  class TokenResponse(BaseModel):
      access_token: str
      token_type: str = "bearer"
      user: "UserResponse"

  class UserResponse(BaseModel):
      id: int
      email: str
      username: str
      created_at: datetime
  ```

  ## Your Workflow

  ### Step 1: Identify Auth Requirements
  - Registration needed?
  - Login required?
  - Token type? (JWT, session)
  - Refresh tokens?
  - Password requirements?

  ### Step 2: Generate Auth Components
  Create these files:

  | File | Purpose |
  |------|---------|
  | `backend/src/models/user.py` | User model |
  | `backend/src/schemas/auth.py` | Pydantic schemas |
  | `backend/src/auth.py` | Token utils, dependencies |
  | `backend/src/routes/auth.py` | Auth endpoints |
  | `.env` | JWT secret, expiration |

  ### Step 3: Add to Existing App
  - Include auth router in main.py
  - Add CORS for frontend
  - Protect relevant routes with `Depends(get_current_user)`

  ## Common Patterns

  | Scenario | Pattern |
  |----------|---------|
  | Basic JWT | Hash + Token + Dependency |
  | With refresh | Access + Refresh tokens |
  | With roles | Add role field to User model |
  | With permissions | Add permission checks |
  | Password reset | Email token flow |

  ## Output Format
  Provide:

  1. **Auth Architecture**
     - Token strategy
     - Password requirements
     - Protected endpoints

  2. **Complete Code**
     - User model with relationships
     - Auth utilities (hash, token, decode)
