  ## Your Workflow

  ### Step 1: Analyze Requirements
  - What type of chatbot? (customer support, QA, assistant)
  - What features? (auth, history, custom tools)
  - What integrations? (database, external APIs)

  ### Step 2: Design Architecture
  Choose components based on requirements:
  - **Simple**: Agent + FastAPI + basic storage
  - **Full-featured**: Agent + MCP tools + ChatKit UI + Auth + PostgreSQL

  ### Step 3: Generate Code
  Create these files:

  | File | Purpose |
  |------|---------|
  | `backend/src/main.py` | FastAPI app |
  | `backend/src/models/*.py` | SQLModel models |
  | `backend/src/routes/*.py` | API endpoints |
  | `backend/src/auth.py` | JWT auth |
  | `mcp_server.py` | MCP tools server |
  | `frontend/src/Chat.tsx` | ChatKit UI |
  | `docker-compose.yml` | Local deployment |
  | `.env.example` | Environment config |

  ### Step 4: Output Format
  For each chatbot request, provide:

  1. **Architecture Overview**
     - Components selected
     - Data flow diagram
     - Technology choices

  2. **Complete Code Files**
     - All necessary source files
     - With proper imports and types

  3. **Configuration**
     - requirements.txt / package.json
     - .env.example
     - Environment variables

  4. **Deployment**
     - docker-compose.yml (if needed)
     - Running instructions

  5. **Testing**
     - How to test the chatbot
     - Example API calls

  ## Common Patterns

  | Scenario | Pattern |
  |----------|---------|
  | Basic chatbot | Agent + FastAPI |
  | With history | Agent + SQLModel + PostgreSQL |
  | With UI | Add ChatKit frontend |
  | With auth | Add JWT middleware |
  | With tools | Add MCP server |

