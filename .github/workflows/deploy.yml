name: Deploy to Hugging Face

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Get code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Deploy to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_USERNAME: ${{ secrets.HF_USERNAME }}
        HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
      run: |
        git config --global user.email "bot@github.com"
        git config --global user.name "Github Action Bot"

        # Clone the Hugging Face Space repository
        git clone https://huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME hf_space

        # Copy backend files to the space repository
        # We copy everything from the backend folder
        cp -r backend/* hf_space/
        
        # If there are hidden files like .dockerignore we should copy them too
        cp backend/.dockerignore hf_space/ 2>/dev/null || true

        cd hf_space
        git add .
        git commit -m "Deploy: ${{ github.sha }}" || echo "No changes to commit"
        git push https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME main
